    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 100%;
            padding: 15px;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .search-container {
            position: relative;
            margin-bottom: 20px;
        }
        #search-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        #search-input:focus {
            border-color: #4CAF50;
        }
        .results-container {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .food-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .food-item:hover {
            background-color: #f9f9f9;
        }
        .food-name {
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        .food-calories {
            color: #4CAF50;
            font-size: 16px;
            margin-top: 5px;
        }
        .no-results {
            text-align: center;
            padding: 20px;
            color: #777;
        }
        .search-type {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .search-type button {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 16px;
            cursor: pointer;
            color: #555;
        }
        .search-type button.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
            font-weight: bold;
        }
        @media (min-width: 768px) {
            .container {
                max-width: 600px;
                margin: 0 auto;
            }
        }
    </style>
</head>

            calorieSearchBtn.addEventListener('click', () => {
                searchType = 'calorie';
                calorieSearchBtn.classList.add('active');
                nameSearchBtn.classList.remove('active');
                searchInput.placeholder = "اكتب عدد السعرات الحرارية...";
                searchInput.value = '';
                showAllFoods();
            });

            // البحث أثناء الكتابة
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                
                if (query === '') {
                    showAllFoods();
                    return;
                }

                if (searchType === 'name') {
                    searchByName(query);
                } else {
                    if (isNaN(query)) {
                        resultsContainer.innerHTML = '<div class="no-results">الرجاء إدخال رقم صحيح للبحث بالسعرات</div>';
                    } else {
                        searchByCalories(parseInt(query));
                    }
                }
            });

            // عرض جميع الأطعمة عند تحميل الصفحة
            showAllFoods();
        }

        // عرض جميع الأطعمة
        function showAllFoods() {
            const foodItems = Object.entries(calorieData)
                .sort((a, b) => a[0].localeCompare(b[0]))
                .map(([name, calories]) => createFoodItem(name, calories))
                .join('');

            resultsContainer.innerHTML = foodItems || '<div class="no-results">لا توجد أطعمة متاحة</div>';
        }

        // البحث بالاسم مع التقريب من أول حرف
        function searchByName(query) {
            const matches = Object.entries(calorieData)
                .filter(([name, calories]) => 
                    name.toLowerCase().includes(query.toLowerCase()) || 
                    getSimilarityRatio(query, name) > 0.3
                )
                .sort((a, b) => {
                    // ترتيب النتائج حسب التشابه مع الاستعلام
                    const aStartsWithQuery = a[0].toLowerCase().startsWith(query.toLowerCase()) ? 1 : 0;
                    const bStartsWithQuery = b[0].toLowerCase().startsWith(query.toLowerCase()) ? 1 : 0;
                    
                    if (aStartsWithQuery !== bStartsWithQuery) {
                        return bStartsWithQuery - aStartsWithQuery;
                    }
                    
                    return getSimilarityRatio(query, b[0]) - getSimilarityRatio(query, a[0]);
                })
                .map(([name, calories]) => createFoodItem(name, calories))
                .join('');

            resultsContainer.innerHTML = matches || '<div class="no-results">لا توجد نتائج مطابقة للبحث</div>';
        }

        // البحث بالسعرات الحرارية مع تقريب الرقم
        function searchByCalories(calories) {
            const threshold = 20; // نطاق التقريب
            const matches = Object.entries(calorieData)
                .filter(([name, cals]) => Math.abs(cals - calories) <= threshold)
                .sort((a, b) => Math.abs(a[1] - calories) - Math.abs(b[1] - calories))
                .map(([name, cals]) => createFoodItem(name, cals))
                .join('');

            resultsContainer.innerHTML = matches || `<div class="no-results">لا توجد أطعمة بسعرات قريبة من ${calories}</div>`;
        }

        // إنشاء عنصر طعام للعرض
        function createFoodItem(name, calories) {
            return `
                <div class="food-item">
                    <div class="food-name">${name}</div>
                    <div class="food-calories">${calories} سعرة حرارية</div>
                </div>
            `;
        }

        // حساب نسبة التشابه بين الكلمات
        function getSimilarityRatio(s1, s2) {
            const longer = s1.length > s2.length ? s1 : s2;
            const shorter = s1.length > s2.length ? s2 : s1;
            
            const longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        // حساب مسافة التحرير (لقياس التشابه بين الكلمات)
        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            
            const costs = [];
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) {
                        costs[j] = j;
                    } else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            }
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        // بدء التطبيق عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', setupUI);
    </script>
